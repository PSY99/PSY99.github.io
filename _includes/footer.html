<footer class="footer">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row my-3">
            <div class="col-6">
                <div class="text-muted">
                    <i>{% if page.lang == 'zh-CN' %}更新于：{{ "now" | date: "%Y 年 %m 月" }}{% else %}Last updated: {{ "now" | date: "%b %Y" }}{% endif %}</i>
                </div>
            </div>
            <div class="col-6">
                <div class="text-right text-muted">
                    {{ site.data.display.footer_text }}
                </div>
            </div>
        </div>
    </div>
</footer>
