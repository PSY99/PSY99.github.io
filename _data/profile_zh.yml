short_bio: >-
  <p>我是罗子安，目前是西安交通大学博士四年级学生，在 MOE KLINNS 实验室开展研究，导师为
  <a href="https://gr.xjtu.edu.cn/en/web/yangliu/home_en" target="_blank">Yang Liu 教授</a>和
  <a href="https://gr.xjtu.edu.cn/en/web/tingliu/home" target="_blank">Ting Liu 教授</a>。
  我于 2023 年获得西安交通大学自动化专业学士学位。自 2026 年 8 月起，我同时在香港大学担任研究助理，由 Chen Ho 教授指导。</p>
  <p>我的研究聚焦于日志分析与漏洞发现，目前主要探索多源日志关联、安全事件提取和自动化漏洞挖掘。</p>
